name: Frontend Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-node resolves the pnpm store path when cache is enabled, so pnpm
      # must be on PATH before this step executes.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm run quality

      # `pnpm run quality` does not cover the contract scripts, so the design
      # snapshot could drift (edited JSON, stale generated types) with a fully
      # green quality gate. Both are offline: they read committed files only.
      #
      # NON-BLOCKING, and deliberately so: the committed design snapshot is
      # behind the live backend (it predates the `OpeningRegistered` asset-movement
      # type), while `src/shared/types/generated/eiams-v1.ts` is AHEAD of it.
      # Regenerating from the stale snapshot would DELETE `OpeningRegistered` and
      # break `src/modules/asset/asset-movement-labels.ts` with TS2353. This step
      # reports that staleness; it must not fail a pull request for a condition
      # the fix (re-ratifying the snapshot from the live API) has not landed yet.
      # See contracts/openapi/README.md.
      - name: Verify generated API types match the contract snapshot (non-blocking)
        continue-on-error: true
        run: pnpm run api:types:check

      - name: Validate contract snapshot and provenance
        run: pnpm run contract:validate
